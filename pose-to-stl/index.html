<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose-to-STL</title>
  <link rel="stylesheet" href="css/main.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <header class="header">
    <h1 class="logo">Pose-to-STL</h1>
    <div class="header-actions">
      <label class="btn">
        Load FBX/GLB
        <input type="file" id="file-input" accept=".fbx,.glb,.gltf" hidden>
      </label>
      <button class="btn" id="reset-view" disabled>Reset view</button>
    </div>
  </header>

  <main class="viewport-wrap">
    <div id="viewport"></div>

    <div class="drop-overlay" id="drop-overlay">
      <div class="drop-message">
        <strong>Drop a Mixamo FBX or GLB here</strong>
        <span>or click "Load FBX/GLB" above</span>
      </div>
    </div>

    <div class="status" id="status">No model loaded. Drag a Mixamo FBX onto this page to begin.</div>
  </main>

  <footer class="toolbar">
    <div class="row">
      <button class="btn btn-icon" id="play-pause" disabled aria-label="Play/Pause">
        <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <input type="range" id="scrubber" min="0" max="1000" value="0" step="1" disabled>
      <span class="time-readout" id="time-readout">0.000s / 0.000s &nbsp;·&nbsp; frame 0</span>
    </div>

    <div class="row">
      <label class="field">
        Scale
        <input type="number" id="scale-input" value="1" step="0.01" min="0.0001">
      </label>
      <div class="presets">
        <button class="btn btn-sm" data-scale="1">1:1</button>
        <button class="btn btn-sm" data-scale="0.1">÷10</button>
        <button class="btn btn-sm" data-scale="0.01">÷100</button>
      </div>
      <span class="bbox-readout" id="bbox-readout">size: —</span>
      <button class="btn btn-primary" id="export-stl" disabled>Export STL</button>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
